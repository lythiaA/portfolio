<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Study | Lythia Amoakon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="min-h-screen flex flex-col selection:bg-[#0F172A] selection:text-[#FAF8F5]">

    <!-- Shared Header -->
    <div id="site-nav"></div>

    <main class="flex-grow max-w-6xl mx-auto px-6 py-12 md:py-20 w-full">
        <!-- Back Navigation -->
        <div class="mb-8 flex items-center justify-between">
            <a href="index.html#work" class="font-mono-tag text-xs text-[#111827] hover:opacity-70 flex items-center gap-2">
                ← Back to Work
            </a>
            <span id="cs-badge" class="font-mono-tag px-3 py-1 rounded surface-sandstone text-[#111827]"></span>
        </div>

        <!-- Dynamic Case Study Container -->
        <div id="case-study-root"></div>

        <!-- Bottom Project Pagination -->
        <div id="project-pagination" class="mt-20 pt-10 border-t border-[#E5E7EB] flex flex-col sm:flex-row items-center justify-between gap-4"></div>
    </main>

    <!-- Shared Footer & Contact Drawer -->
    <div id="site-footer"></div>

    <!-- Load Shared Components + 10 Individual Decentralized Project Files -->
    <script src="assets/components.js"></script>
    <script src="projects/saas-lms-onboarding.js"></script>
    <script src="projects/c999-faculty-simulation.js"></script>
    <script src="projects/millionaire-data-quiz.js"></script>
    <script src="projects/adaptive-study-architect.js"></script>
    <script src="projects/first-client-call.js"></script>
    <script src="projects/leading-with-impact.js"></script>
    <script src="projects/power-automate-ops.js"></script>
    <script src="projects/mysql-joins-cohort.js"></script>
    <script src="projects/sql-gamified-labs.js"></script>
    <script src="projects/math-of-ai-labs.js"></script>
    <script src="projects/digital-accessibility-module.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const catalog = window.PORTFOLIO_PROJECTS || {};
            const projectOrder = [
                "saas-lms-onboarding",
                "c999-faculty-simulation",
                "millionaire-data-quiz",
                "adaptive-study-architect",
                "first-client-call",
                "leading-with-impact",
                "power-automate-ops",
                "mysql-joins-cohort",
                "sql-gamified-labs",
                "math-of-ai-labs",
                "digital-accessibility-module"
            ];

            const params = new URLSearchParams(window.location.search);
            const currentId = params.get('id') || projectOrder[0];
            const cs = catalog[currentId] || catalog[projectOrder[0]];

            if (!cs) return;

            document.title = `${cs.title} | Lythia Amoakon`;
            document.getElementById('cs-badge').textContent = cs.badge;

            const root = document.getElementById('case-study-root');
            root.innerHTML = `
                <!-- Title & Subtitle -->
                <div class="mb-12">
                    <h1 class="font-display text-3xl sm:text-4xl md:text-5xl font-extrabold text-[#111827] leading-tight mb-4">${cs.title}</h1>
                    <p class="text-lg md:text-xl text-[#4B5563] max-w-4xl leading-relaxed">${cs.subtitle}</p>
                </div>

                <!-- 4-Column Executive Metadata Bar -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-16">
                    <div class="p-4 rounded surface-sandstone">
                        <span class="font-mono-tag text-[10px] text-slate-500 block mb-1">My Role</span>
                        <p class="font-semibold text-sm text-[#111827]">${cs.meta.role}</p>
                    </div>
                    <div class="p-4 rounded surface-sandstone">
                        <span class="font-mono-tag text-[10px] text-slate-500 block mb-1">Target Audience</span>
                        <p class="font-semibold text-sm text-[#111827]">${cs.meta.audience}</p>
                    </div>
                    <div class="p-4 rounded surface-sandstone">
                        <span class="font-mono-tag text-[10px] text-slate-500 block mb-1">Tools & Stack</span>
                        <p class="font-semibold text-sm text-[#111827]">${cs.meta.stack}</p>
                    </div>
                    <div class="p-4 rounded surface-sandstone">
                        <span class="font-mono-tag text-[10px] text-slate-500 block mb-1">Key Outcome</span>
                        <p class="font-semibold text-sm text-[#111827]">${cs.meta.impact}</p>
                    </div>
                </div>

                <!-- 01 & 02: Challenge & Persona Grid -->
                <div class="grid md:grid-cols-2 gap-8 mb-16">
                    <div class="p-8 rounded surface-white">
                        <span class="font-mono-tag text-xs text-slate-500 block mb-2">01 / The Operational & Learning Gap</span>
                        <h2 class="font-display text-2xl font-bold text-[#111827] mb-3">The Challenge</h2>
                        <p class="text-sm md:text-base text-[#4B5563] leading-relaxed">${cs.challenge}</p>
                    </div>
                    <div class="p-8 rounded surface-white">
                        <span class="font-mono-tag text-xs text-slate-500 block mb-2">02 / Human-Centered Discovery</span>
                        <h2 class="font-display text-2xl font-bold text-[#111827] mb-3">The Target Persona</h2>
                        <p class="text-sm md:text-base text-[#4B5563] leading-relaxed">${cs.persona}</p>
                    </div>
                </div>

                <!-- 03: Execution, Methodology & Measuring Success -->
                <div class="mb-16">
                    <span class="font-mono-tag text-xs text-slate-500 block mb-2">03 / System Design, Delivery & Evaluation</span>
                    <h2 class="font-display text-3xl font-bold text-[#111827] mb-8">Execution & Methodology</h2>
                    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
                        ${cs.features.map((f, i) => `
                            <div class="p-6 rounded surface-white">
                                <span class="font-mono-tag text-[10px] text-slate-400 block mb-2">0${i + 1}</span>
                                <h3 class="font-display font-bold text-lg text-[#111827] mb-2">${f.title}</h3>
                                <p class="text-xs sm:text-sm text-[#4B5563] leading-relaxed">${f.desc}</p>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Measuring Success & Impact (Paired directly under Execution & Methodology) -->
                    <div class="p-8 rounded bg-[#0F172A] text-[#FAF8F5]">
                        <span class="font-mono-tag text-xs text-[#E5E7EB]/60 block mb-2">Evaluation & Impact</span>
                        <h3 class="font-display text-2xl font-bold mb-6">Measuring Success</h3>
                        <div class="grid md:grid-cols-2 gap-6">
                            <div class="p-5 rounded bg-white/5 border border-white/10">
                                <h4 class="font-display font-bold text-lg text-[#FAF8F5] mb-2">${cs.evaluation.metric1Title}</h4>
                                <p class="text-xs sm:text-sm text-[#E5E7EB]/80 leading-relaxed">${cs.evaluation.metric1Desc}</p>
                            </div>
                            <div class="p-5 rounded bg-white/5 border border-white/10">
                                <h4 class="font-display font-bold text-lg text-[#FAF8F5] mb-2">${cs.evaluation.metric2Title}</h4>
                                <p class="text-xs sm:text-sm text-[#E5E7EB]/80 leading-relaxed">${cs.evaluation.metric2Desc}</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 04: Top 3 Skills Displayed -->
                ${cs.skills ? `
                <div class="mb-16 p-8 rounded surface-sandstone">
                    <span class="font-mono-tag text-xs text-slate-500 block mb-2">04 / Core Competencies in Action</span>
                    <h2 class="font-display text-2xl md:text-3xl font-bold text-[#111827] mb-6">Top Skills Displayed</h2>
                    <div class="grid md:grid-cols-3 gap-6">
                        ${cs.skills.map(s => `
                            <div class="p-5 rounded bg-white border border-[#E5E7EB]">
                                <span class="font-mono-tag text-[10px] px-2.5 py-1 rounded bg-[#0F172A] text-[#FAF8F5] inline-block mb-3">${s.skill}</span>
                                <p class="text-xs sm:text-sm text-[#4B5563] leading-relaxed">${s.desc}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>` : ''}

                <!-- 05: Interactive Experience & Live Demo -->
                ${cs.renderInteractive ? `
                <div class="mb-16">
                    <div class="mb-6">
                        <span class="font-mono-tag text-xs text-slate-500 block mb-2">05 / Interactive Experience & Live Demo</span>
                        <h2 class="font-display text-3xl font-bold text-[#111827] mb-2">${cs.demoTitle || 'Explore the Live Deliverable'}</h2>
                        ${cs.demoIntro ? `<p class="text-sm md:text-base text-[#4B5563] max-w-3xl leading-relaxed">${cs.demoIntro}</p>` : ''}
                    </div>
                    ${cs.renderInteractive()}
                </div>` : ''}

                <!-- 06: Cross-Industry & Target Role Transferability Block -->
                ${cs.transferability ? `
                <div class="p-8 rounded surface-sandstone">
                    <span class="font-mono-tag text-xs text-slate-500 block mb-2">06 / Cross-Functional Architecture</span>
                    <h2 class="font-display text-2xl md:text-3xl font-bold text-[#111827] mb-6">How This Structure Applies Across Target Roles</h2>
                    <div class="grid md:grid-cols-3 gap-6">
                        ${cs.transferability.map(t => `
                            <div class="p-5 rounded bg-white border border-[#E5E7EB]">
                                <span class="font-mono-tag text-[10px] px-2.5 py-1 rounded bg-[#0F172A] text-[#FAF8F5] inline-block mb-3">${t.role}</span>
                                <p class="text-xs sm:text-sm text-[#4B5563] leading-relaxed">${t.application}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>` : ''}
            `;

            // Initialize Project-Specific Interactive Widget
            if (cs.initInteractive) cs.initInteractive();

            // Render Bottom Pagination
            const idx = projectOrder.indexOf(currentId);
            const prevId = projectOrder[(idx - 1 + projectOrder.length) % projectOrder.length];
            const nextId = projectOrder[(idx + 1) % projectOrder.length];
            const prevCs = catalog[prevId];
            const nextCs = catalog[nextId];

            if (prevCs && nextCs) {
                document.getElementById('project-pagination').innerHTML = `
                    <a href="project.html?id=${prevId}" class="p-4 rounded surface-white w-full sm:w-auto text-left">
                        <span class="font-mono-tag text-[10px] text-slate-500 block">← Previous Project</span>
                        <span class="font-display font-bold text-sm text-[#111827]">${prevCs.title}</span>
                    </a>
                    <a href="project.html?id=${nextId}" class="p-4 rounded surface-white w-full sm:w-auto text-right">
                        <span class="font-mono-tag text-[10px] text-slate-500 block">Next Project →</span>
                        <span class="font-display font-bold text-sm text-[#111827]">${nextCs.title}</span>
                    </a>
                `;
            }
        });
    </script>
</body>
</html>
<!-- END OF FILE -->
