<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rover Descent | Interactive Gradient Descent Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="game-viewport">
    <!-- Top Game HUD -->
    <header class="hud-header">
      <div class="hud-brand">
        <span class="mission-pill">MATH OF AI • MISSION LAB</span>
        <h1>Rover Descent</h1>
      </div>

      <nav class="level-selector" id="levelTabs" aria-label="Mission Levels">
        <button class="lvl-pill active" data-lvl="0">01. Foggy Valley</button>
        <button class="lvl-pill" data-lvl="1">02. Steep Canyon</button>
        <button class="lvl-pill" data-lvl="2">03. False Bottom</button>
      </nav>

      <div class="hud-actions">
        <button class="icon-pill" id="fogToggleBtn" type="button">Radar Peek: OFF</button>
        <button class="icon-pill" id="resetBtn" type="button">Reset</button>
      </div>
    </header>

    <!-- Main Full-Screen Stage -->
    <main class="stage-container">
      <!-- Mission Briefing Bar -->
      <div class="briefing-bar">
        <div class="briefing-text">
          <h2 id="levelTitle">Loading mission...</h2>
          <p id="levelDesc"></p>
        </div>
        <div class="telemetry-grid">
          <div class="tele-box">
            <span class="tele-label">BATTERY (STEPS)</span>
            <span class="tele-value" id="stepsDisplay">0 / 7</span>
          </div>
          <div class="tele-box">
            <span class="tele-label">ALTITUDE (LOSS)</span>
            <span class="tele-value" id="lossDisplay">--</span>
          </div>
          <div class="tele-box">
            <span class="tele-label">SLOPE (GRADIENT)</span>
            <span class="tele-value" id="gradDisplay">--</span>
          </div>
        </div>
      </div>

      <!-- Interactive Canvas World -->
      <div class="canvas-stage">
        <canvas id="gameCanvas"></canvas>

        <!-- End-of-Run Outcome Overlay (Win or Fail) -->
        <div class="outcome-overlay hidden" id="outcomeOverlay">
          <div class="outcome-card" id="outcomeCard">
            <span class="outcome-tag" id="outcomeTag">MISSION STATUS</span>
            <h3 id="outcomeTitle">Title</h3>
            <p class="outcome-reason" id="outcomeReason"></p>
            <div class="outcome-math-box">
              <span class="math-label">THE MATH OF AI TAKEAWAY</span>
              <p id="outcomeMath"></p>
            </div>
            <div class="outcome-buttons">
              <button class="btn-game-outline" id="overlayRetryBtn" type="button">Try Again</button>
              <button class="btn-game-primary" id="overlayNextBtn" type="button">Next Mission →</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Bottom Command Console -->
      <section class="command-console">
        <div class="slider-zone">
          <div class="slider-meta">
            <label for="lrSlider">LEARNING RATE (STEP SIZE)</label>
            <span class="lr-value" id="lrValue">0.35</span>
          </div>
          <input type="range" id="lrSlider" min="0.05" max="2.50" step="0.05" value="0.35" />
          <div class="slider-scale">
            <span>0.05</span>
            <span>1.25</span>
            <span>2.50</span>
          </div>
        </div>

        <div class="action-zone">
          <button class="btn-launch" id="stepBtn" type="button">
            FIRE THRUSTERS (STEP)
          </button>
        </div>
      </section>

      <!-- Live Telemetry Log -->
      <div class="live-log" id="feedbackLog">
        <span class="log-dot"></span>
        <span id="feedbackText">Adjust the Learning Rate slider and fire thrusters to guide the rover to the lowest point.</span>
      </div>
    </main>
  </div>

  <script src="levels.js"></script>
  <script src="app.js"></script>
</body>
</html>
<!-- END OF FILE -->
